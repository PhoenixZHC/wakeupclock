<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>别睡了 - 智能闹钟</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #1e1b4b 0%, #312e81 28%, #4c1d95 50%, #5b21b6 72%, #7c3aed 100%);
            background-attachment: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }
        /* 装饰：模拟清晨光晕 */
        body::before {
            content: '';
            position: fixed;
            top: -20%;
            right: -10%;
            width: 60%;
            height: 60%;
            background: radial-gradient(ellipse, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
            pointer-events: none;
        }
        body::after {
            content: '';
            position: fixed;
            bottom: -15%;
            left: -15%;
            width: 50%;
            height: 50%;
            background: radial-gradient(ellipse, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            pointer-events: none;
        }
        .page {
            position: relative;
            z-index: 1;
            max-width: 440px;
            width: 100%;
        }
        .card {
            background: rgba(255, 255, 255, 0.97);
            border-radius: 28px;
            padding: 40px 36px 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .app-icon-wrap {
            width: 96px;
            height: 96px;
            margin: 0 auto 20px;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.25);
        }
        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1e1b4b;
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }
        .tagline {
            font-size: 15px;
            color: #6366f1;
            font-weight: 500;
            margin-bottom: 28px;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }
        .feature {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            border-radius: 14px;
            padding: 12px 8px;
            text-align: center;
        }
        .feature-icon { font-size: 22px; margin-bottom: 4px; line-height: 1; }
        .feature span { font-size: 11px; color: #5b21b6; font-weight: 500; }
        .btns { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            padding: 16px 24px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #7c3aed 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }
        .btn-primary:hover { box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45); }
        .btn-secondary {
            background: #fff;
            color: #6366f1;
            border: 2px solid #c4b5fd;
        }
        .btn-secondary:hover { background: #f5f3ff; border-color: #a78bfa; }
        .footer {
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #e9e5f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .footer-links { display: flex; gap: 20px; }
        .footer a { color: #8b7aa8; font-size: 13px; text-decoration: none; }
        .footer a:hover { color: #6366f1; }
        .copy { font-size: 12px; color: #8b7aa8; }
        @media (max-width: 480px) {
            .card { padding: 32px 24px 28px; }
            .features { gap: 8px; }
            .feature { padding: 10px 6px; }
            .feature span { font-size: 10px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="card">
            <div class="app-icon-wrap">
                <img src="images/app-icon.png" alt="别睡了" class="app-icon" width="96" height="96">
            </div>
            <h1>别睡了</h1>
            <p class="tagline">专治起床困难户</p>
            <div class="features">
                <div class="feature"><div class="feature-icon">🔔</div><span>系统闹钟</span></div>
                <div class="feature"><div class="feature-icon">🧩</div><span>任务解锁</span></div>
                <div class="feature"><div class="feature-icon">🛡️</div><span>防赖床</span></div>
                <div class="feature"><div class="feature-icon">📅</div><span>打卡记录</span></div>
            </div>
            <div class="btns">
                <a href="#" id="download-btn" class="btn btn-primary">下载 Android 版</a>
                <a href="https://apps.apple.com/app/id6757984120" id="appstore-btn" class="btn btn-secondary">App Store 下载</a>
            </div>
            <div class="footer">
                <div class="footer-links">
                    <a href="privacy.html">隐私政策</a>
                    <a href="support.html">技术支持</a>
                </div>
                <span class="copy">© 2024-2026 别睡了 (Wakeup Clock)</span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var btn = document.getElementById('download-btn');
            fetch('/api/version')
                .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                .then(function(d) {
                    if (d.apkUrl) btn.href = d.apkUrl;
                })
                .catch(function() { btn.href = '#'; });
        })();
    </script>
</body>
</html>
